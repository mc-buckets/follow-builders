name: Sync Feeds from Upstream

on:
  schedule:
    # Upstream regenerates feeds at 6am UTC; sync ~1h later to be safe.
    - cron: '23 7 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest feeds from upstream
        run: |
          UPSTREAM_RAW="https://raw.githubusercontent.com/zarazhangrui/follow-builders/main"
          for f in feed-x.json feed-podcasts.json feed-blogs.json state-feed.json; do
            curl -fsSL "$UPSTREAM_RAW/$f" -o "$f"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-x.json feed-podcasts.json feed-blogs.json state-feed.json
          git diff --cached --quiet || git commit -m "chore: sync feeds from upstream [skip ci]"
          git push
